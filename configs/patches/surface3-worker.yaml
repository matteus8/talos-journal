machine:
  install:
    disk: /dev/mmcblk0
  network:
    nameservers:
      - 192.168.1.1
      - 1.1.1.1
    interfaces:
      - interface: eth0
        dhcp: false
        addresses:
          - 192.168.1.106/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
  systemDiskEncryption:
    state:
      provider: luks2
      keys:
        - slot: 0
          tpm: {}
        - nodeID: {}
    ephemeral:
      provider: luks2
      keys:
        - slot: 0
          tpm: {}
        - nodeID: {}
